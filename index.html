<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Fence Feud</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 8 8%22%3E%3Crect x=%221%22 y=%222%22 width=%226%22 height=%224%22 fill=%22%23c07a3c%22/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="stage">
      <canvas id="game"></canvas>
      <div id="ui">
        <div id="hud" class="hidden">
          <div class="hp left">
            <div class="label"><span id="name0">BISCUIT</span> <span id="hpv0" class="num">100</span></div>
            <div class="bar"><div id="hp0" class="fill ok"></div></div>
          </div>
          <div class="hp right">
            <div class="label"><span id="hpv1" class="num">100</span> <span id="name1">MISO</span></div>
            <div class="bar"><div id="hp1" class="fill ok"></div></div>
          </div>
          <div id="wind">
            <div class="label">WIND</div>
            <div class="track"><div id="windFill"></div><div class="mid"></div></div>
            <div id="windVal">CALM</div>
          </div>
          <div id="status0" class="status left"></div>
          <div id="status1" class="status right"></div>
          <div id="bag0" class="bag left"></div>
          <div id="bag1" class="bag right"></div>
          <div id="itemTip" class="hidden"></div>
          <div id="controls">
            <button id="angDown" class="tiny" aria-label="Lower angle">-</button>
            <span class="label">ANG</span> <span id="angle">45</span>
            <button id="angUp" class="tiny" aria-label="Raise angle">+</button>
            <span class="label pw">PWR</span>
            <div class="power"><div id="powerFill"></div><div id="powerLast"></div></div>
          </div>
        </div>
        <div id="aimLabel" class="hidden"></div>
        <div id="banner" class="hidden"></div>
        <div id="flash"></div>
        <div id="popups"></div>

        <div id="menu" class="screen">
          <h1>FENCE<br />FEUD</h1>
          <p class="sub">DOG vs CAT</p>
          <button data-mode="cpu">1P VS CPU</button>
          <button data-mode="local">2P SAME PC</button>
          <button data-mode="online">2P ONLINE</button>
          <p class="hint">MOUSE OR UP/DOWN TO AIM<br />HOLD CLICK OR SPACE TO THROW<br />PICK ITEMS - USE WITH 1-4</p>
        </div>

        <div id="draft" class="screen hidden">
          <h3 id="draftTitle">PICK AN ITEM</h3>
          <div id="cards"></div>
          <p class="hint">CLICK A CARD OR PRESS 1-3</p>
        </div>

        <div id="online" class="screen hidden">
          <h2>ONLINE</h2>
          <div id="lobbyHome" class="lobby">
            <button id="createRoom">CREATE ROOM</button>
            <div class="join-row">
              <input id="joinCode" maxlength="5" placeholder="CODE" autocomplete="off" spellcheck="false" />
              <button id="joinRoom">JOIN</button>
            </div>
            <button id="lobbyBack">BACK</button>
          </div>
          <div id="lobbyRoom" class="lobby hidden">
            <p class="sub">ROOM CODE</p>
            <p id="roomCode" class="code">-----</p>
            <button id="copyLink">COPY LINK</button>
            <button id="lobbyCancel">CANCEL</button>
          </div>
          <p id="lobbyMsg" class="hint"></p>
        </div>

        <div id="over" class="screen hidden">
          <h2 id="overTitle">YOU WIN!</h2>
          <p id="overSub" class="sub"></p>
          <button id="rematch">REMATCH</button>
          <button id="toMenu">MENU</button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
